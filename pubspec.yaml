name: luc
description: A new Flutter project for Lincoln University College.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  firebase_storage: ^12.1.1
  firebase_messaging: ^15.0.2
 
  flutter_native_splash: ^2.3.9

  provider: ^6.1.2
  http: ^1.2.1
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  flutter_dotenv: ^5.1.0
  intl: ^0.20.2

  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  file_picker: ^8.0.5
  open_filex: ^4.4.0
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0
  path_provider: ^2.1.3
  url_launcher: ^6.3.0
  mime: ^1.0.5

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.4.3+1

  just_audio: ^0.9.38
  video_thumbnail: ^0.5.3
  video_player: ^2.8.6

 # for the chatbot
  string_similarity: ^2.0.0
  google_generative_ai: ^0.2.2 # Use the latest version

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.10


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/lucicon.png"
  adaptive_icon_background: "#F43D33"
  adaptive_icon_foreground: "assets/images/lucicon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true 


  assets:
    - .env
    - assets/images/
    - assets/data/

flutter_native_splash:
  color: "#160201"


  android: true
  ios: true

  


dependency_overrides:
  analyzer: ^6.4.1